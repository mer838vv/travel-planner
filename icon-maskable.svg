<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Maskable: Android режет иконку под форму своей темы (круг, каплю,
       квадрат со скруглением). Гарантированно виден только центральный
       круг диаметром 80% поля, поэтому булавка ужата до 0.7 — её габарит
       укладывается в круг диаметром ~53 с большим запасом. -->
  <rect width="100" height="100" fill="#2563eb"/>
  <g transform="translate(50 50) scale(0.7) translate(-50 -50)">
    <path d="M50 20c-12.7 0-23 10.3-23 23 0 17.3 23 37 23 37s23-19.7 23-37c0-12.7-10.3-23-23-23z" fill="white"/>
    <circle cx="50" cy="43" r="9" fill="#2563eb"/>
  </g>
</svg>
